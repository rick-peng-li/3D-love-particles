<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Love Particles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            overflow: hidden;
            height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #video-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 100;
            background: #000;
        }

        #video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #video-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls h2 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="color"] {
            width: 50px;
            height: 35px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 2px;
        }

        input[type="color"]::-webkit-color-swatch {
            border-radius: 6px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .color-value {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-family: monospace;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .status-item:last-child {
            margin-bottom: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .status-dot.active {
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
        }

        .status-dot.inactive {
            background: #f87171;
        }

        .gesture-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gesture-indicator.visible {
            opacity: 1;
        }

        .gesture-indicator span {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 24px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            max-width: 280px;
        }

        .instructions h3 {
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .instructions ul {
            list-style: none;
            padding: 0;
        }

        .instructions li {
            margin-bottom: 8px;
            padding-left: 15px;
            position: relative;
        }

        .instructions li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #ff6b9d;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="controls">
        <h2>🎨 粒子控制</h2>
        <div class="control-group">
            <label>粒子颜色</label>
            <div class="color-picker-wrapper">
                <input type="color" id="particleColor" value="#ff6b9d">
                <span class="color-value" id="colorValue">#ff6b9d</span>
            </div>
        </div>
        <div class="control-group">
            <label>发光颜色</label>
            <div class="color-picker-wrapper">
                <input type="color" id="glowColor" value="#ff9ed2">
                <span class="color-value" id="glowValue">#ff9ed2</span>
            </div>
        </div>
        <div class="status">
            <div class="status-item">
                <span><span class="status-dot inactive" id="cameraStatus"></span>摄像头</span>
                <span id="cameraStatusText">未连接</span>
            </div>
            <div class="status-item">
                <span><span class="status-dot inactive" id="handStatus"></span>手势检测</span>
                <span id="handStatusText">等待中</span>
            </div>
            <div class="status-item">
                <span>扩散程度</span>
                <span id="spreadValue">0%</span>
            </div>
        </div>
    </div>

    <div class="instructions">
        <h3>📖 使用说明</h3>
        <ul>
            <li>张开双手 → 粒子扩散</li>
            <li>握紧双手 → 粒子聚合</li>
            <li>使用颜色选择器调整粒子颜色</li>
        </ul>
    </div>

    <div id="video-container">
        <video id="video" playsinline></video>
        <canvas id="handCanvas"></canvas>
    </div>

    <div class="gesture-indicator" id="gestureIndicator">
        <span id="gestureText"></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const PARTICLE_COUNT = 2000;
        const HEART_SHAPE = true;

        let scene, camera, renderer, particles, controls;
        let particlePositions = [];
        let targetPositions = [];
        let originalPositions = [];
        let spreadTargetPositions = [];
        let spreadFactor = 0;
        let targetSpreadFactor = 0;
        let particleColor = new THREE.Color('#ff6b9d');
        let glowColor = new THREE.Color('#ff9ed2');

        const video = document.getElementById('video');
        const handCanvas = document.getElementById('handCanvas');
        const handCtx = handCanvas.getContext('2d');

        function createHeartShape(t, scale = 1) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x * scale, y: y * scale };
        }

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            createParticles();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff6b9d, 1, 100);
            pointLight.position.set(0, 0, 30);
            scene.add(pointLight);

            window.addEventListener('resize', onWindowResize);
            
            setupColorPickers();
            setupHandTracking();

            animate();
        }

        function createParticles() {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(PARTICLE_COUNT * 3);
            const colors = new Float32Array(PARTICLE_COUNT * 3);
            const sizes = new Float32Array(PARTICLE_COUNT);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = (i / PARTICLE_COUNT) * Math.PI * 2;
                const heart = createHeartShape(t, 0.8);
                
                const randomOffset = 0.5;
                const x = heart.x + (Math.random() - 0.5) * randomOffset;
                const y = heart.y + (Math.random() - 0.5) * randomOffset;
                const z = (Math.random() - 0.5) * randomOffset;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                originalPositions.push({ x, y, z });
                particlePositions.push({ x, y, z });
                targetPositions.push({ x, y, z });

                const spreadX = (Math.random() - 0.5) * 120;
                const spreadY = (Math.random() - 0.5) * 80;
                const spreadZ = (Math.random() - 0.5) * 60;
                spreadTargetPositions.push({ x: spreadX, y: spreadY, z: spreadZ });

                colors[i * 3] = particleColor.r;
                colors[i * 3 + 1] = particleColor.g;
                colors[i * 3 + 2] = particleColor.b;

                sizes[i] = Math.random() * 0.5 + 0.3;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const vertexShader = `
                attribute float size;
                attribute vec3 color;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;

            const fragmentShader = `
                varying vec3 vColor;
                void main() {
                    vec2 uv = gl_PointCoord - vec2(0.5);
                    float x = uv.x;
                    float y = -uv.y;
                    
                    float heart = x * x + y * y - 1.0;
                    heart = heart * heart * heart - x * x * y * y * y;
                    
                    if (heart > 0.0) discard;
                    
                    float dist = length(uv);
                    float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
                    vec3 glow = vColor * 1.5;
                    vec3 finalColor = mix(vColor, glow, 0.3);
                    gl_FragColor = vec4(finalColor, alpha * 0.9);
                }
            `;

            const material = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function updateParticlePositions() {
            const positions = particles.geometry.attributes.position.array;
            const colors = particles.geometry.attributes.color.array;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const original = originalPositions[i];
                const spread = spreadTargetPositions[i];

                targetPositions[i] = {
                    x: original.x + (spread.x - original.x) * spreadFactor,
                    y: original.y + (spread.y - original.y) * spreadFactor,
                    z: original.z + (spread.z - original.z) * spreadFactor
                };

                particlePositions[i].x += (targetPositions[i].x - particlePositions[i].x) * 0.08;
                particlePositions[i].y += (targetPositions[i].y - particlePositions[i].y) * 0.08;
                particlePositions[i].z += (targetPositions[i].z - particlePositions[i].z) * 0.08;

                positions[i * 3] = particlePositions[i].x;
                positions[i * 3 + 1] = particlePositions[i].y;
                positions[i * 3 + 2] = particlePositions[i].z;

                const colorMix = spreadFactor * 0.5;
                colors[i * 3] = particleColor.r * (1 - colorMix) + glowColor.r * colorMix;
                colors[i * 3 + 1] = particleColor.g * (1 - colorMix) + glowColor.g * colorMix;
                colors[i * 3 + 2] = particleColor.b * (1 - colorMix) + glowColor.b * colorMix;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
        }

        function setupColorPickers() {
            const particleColorInput = document.getElementById('particleColor');
            const glowColorInput = document.getElementById('glowColor');
            const colorValue = document.getElementById('colorValue');
            const glowValue = document.getElementById('glowValue');

            particleColorInput.addEventListener('input', (e) => {
                particleColor = new THREE.Color(e.target.value);
                colorValue.textContent = e.target.value;
            });

            glowColorInput.addEventListener('input', (e) => {
                glowColor = new THREE.Color(e.target.value);
                glowValue.textContent = e.target.value;
            });
        }

        async function setupHandTracking() {
            try {
                const hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.8,
                    minTrackingConfidence: 0.6
                });

                hands.onResults(onHandResults);

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: 640, 
                        height: 480,
                        facingMode: 'user'
                    } 
                });
                
                video.srcObject = stream;
                await video.play();

                handCanvas.width = video.videoWidth;
                handCanvas.height = video.videoHeight;

                document.getElementById('cameraStatus').classList.remove('inactive');
                document.getElementById('cameraStatus').classList.add('active');
                document.getElementById('cameraStatusText').textContent = '已连接';

                async function detect() {
                    await hands.send({ image: video });
                    requestAnimationFrame(detect);
                }
                detect();

            } catch (error) {
                console.error('Hand tracking setup error:', error);
                document.getElementById('cameraStatusText').textContent = '连接失败';
            }
        }

        function calculateHandOpenness(landmarks) {
            const wrist = landmarks[0];
            const fingerTips = [landmarks[4], landmarks[8], landmarks[12], landmarks[16], landmarks[20]];
            const fingerMids = [landmarks[2], landmarks[5], landmarks[9], landmarks[13], landmarks[17]];
            
            let opennessScore = 0;
            
            for (let i = 0; i < 5; i++) {
                const tip = fingerTips[i];
                const mid = fingerMids[i];
                
                const tipDist = Math.sqrt(
                    Math.pow(tip.x - wrist.x, 2) + 
                    Math.pow(tip.y - wrist.y, 2)
                );
                
                const midDist = Math.sqrt(
                    Math.pow(mid.x - wrist.x, 2) + 
                    Math.pow(mid.y - wrist.y, 2)
                );
                
                if (tipDist > midDist * 1.2) {
                    opennessScore += 1;
                } else if (tipDist > midDist * 0.9) {
                    opennessScore += 0.5;
                }
            }
            
            return opennessScore / 5;
        }

        function onHandResults(results) {
            handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                document.getElementById('handStatus').classList.remove('inactive');
                document.getElementById('handStatus').classList.add('active');
                document.getElementById('handStatusText').textContent = '检测中';

                let totalOpenness = 0;
                
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    handCtx.strokeStyle = '#ff6b9d';
                    handCtx.lineWidth = 2;
                    
                    const connections = [
                        [0, 1], [1, 2], [2, 3], [3, 4],
                        [0, 5], [5, 6], [6, 7], [7, 8],
                        [0, 9], [9, 10], [10, 11], [11, 12],
                        [0, 13], [13, 14], [14, 15], [15, 16],
                        [0, 17], [17, 18], [18, 19], [19, 20],
                        [5, 9], [9, 13], [13, 17]
                    ];

                    connections.forEach(([start, end]) => {
                        handCtx.beginPath();
                        handCtx.moveTo(landmarks[start].x * handCanvas.width, landmarks[start].y * handCanvas.height);
                        handCtx.lineTo(landmarks[end].x * handCanvas.width, landmarks[end].y * handCanvas.height);
                        handCtx.stroke();
                    });

                    landmarks.forEach(landmark => {
                        handCtx.fillStyle = '#fff';
                        handCtx.beginPath();
                        handCtx.arc(landmark.x * handCanvas.width, landmark.y * handCanvas.height, 3, 0, Math.PI * 2);
                        handCtx.fill();
                    });

                    totalOpenness += calculateHandOpenness(landmarks);
                });

                const avgOpenness = totalOpenness / results.multiHandLandmarks.length;
                targetSpreadFactor = avgOpenness;

                const gestureIndicator = document.getElementById('gestureIndicator');
                const gestureText = document.getElementById('gestureText');
                
                if (avgOpenness > 0.5) {
                    gestureText.textContent = '✨ 扩散中...';
                    gestureIndicator.classList.add('visible');
                } else if (avgOpenness < 0.25) {
                    gestureText.textContent = '💫 聚合中...';
                    gestureIndicator.classList.add('visible');
                } else {
                    gestureIndicator.classList.remove('visible');
                }

            } else {
                document.getElementById('handStatus').classList.remove('active');
                document.getElementById('handStatus').classList.add('inactive');
                document.getElementById('handStatusText').textContent = '未检测到手';
                document.getElementById('gestureIndicator').classList.remove('visible');
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            spreadFactor += (targetSpreadFactor - spreadFactor) * 0.08;
            
            document.getElementById('spreadValue').textContent = Math.round(spreadFactor * 100) + '%';

            updateParticlePositions();

            particles.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
